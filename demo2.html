        // 创建机器人头顶标签的函数
        function createRobotLabel() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 50;
            canvas.height = 20;

            // 创建canvas纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            // 创建材质
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false // 确保标签始终可见
            });

            // 创建精灵对象
            robotLabel = new THREE.Sprite(material);
            robotLabel.scale.set(1, 0.5, 0.5); // 调整标签大小
            robotLabel.visible = false; // 初始隐藏
            scene.add(robotLabel);
        }

        // 更新标签内容的函数
        function updateLabelContent(text) {
            if (!robotLabel || currentLabelContent === text) return;
            currentLabelContent = text;
            if (text === '') {
                robotLabel.visible = false;
                return;
            }
            robotLabel.visible = true;
            // 更新canvas内容
            const canvas = robotLabel.material.map.image;
            const context = canvas.getContext('2d');

            // 清空画布
            context.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            context.fillStyle = 'rgba(0, 0, 0, 0.5)';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制文字
            context.font = '12px Arial';
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            // 文字换行处理
            const words = text.split('');
            let line = '';
            const lines = [];
            const maxWidth = canvas.width;

            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i];
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(line);
                    line = words[i];
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            // 绘制多行文字
            const lineHeight = 30;
            const startY = (canvas.height - (lines.length - 1) * lineHeight) / 2;

            for (let i = 0; i < lines.length; i++) {
                context.fillText(lines[i], canvas.width / 2, startY + i * lineHeight);
            }

            // 更新纹理
            robotLabel.material.map.needsUpdate = true;
            if (scene) {
                scene.traverse((child) => {
                    if (child.isMesh && child.chartController) {
                        child.chartController.setTitle(currentLabelContent);
                    }
                });
            }
        }

        function loadMap() {
            gltfLoader.load("./sketchMap.glb", (gltf) => {
                map = SkeletonUtils.clone(gltf.scene);
                map.scale.set(1, 1, 1);
                const modelMap = gltf.scene;
                let arrMachines = [];
                modelMap.children.forEach((child) => {
                    if (child) {
                        arrMachines.push(child);
                    }
                });
                modelAll = arrMachines;
                scene.add(map);

                // 在模型中查找门
                findDoorsInModel(map);

                // 在模型中查找屏幕
                findScreenInModel(map);
            });
        }

        function findDoorsInModel(model) {
            model.traverse((child) => {
                if (child.isMesh) {
                    if (child.name && child.name.toLowerCase().includes('左侧门')) {
                        leftDoor = child;
                        doorInitialZ.left = child.position.z;
                    }
                    if (child.name && child.name.toLowerCase().includes('右侧门')) {
                        rightDoor = child;
                        doorInitialZ.right = child.position.z;
                    }
                }
            });
        }

        function findScreenInModel(model) {
            model.traverse((child) => {
                if (child.isMesh && child.name && child.name.includes('屏幕')) {
                    setupChartTexture(child);
                }
            });
        }

        // 载入机器人
        function loadRobot() {
            gltfLoader.load("./animation3.glb", (gltf) => {
                robot = SkeletonUtils.clone(gltf.scene);
                robot.scale.set(2, 2, 2);
                scene.add(robot);

                mixer = new THREE.AnimationMixer(robot);
                walkAction = mixer.clipAction(gltf.animations[4]); // walk 动画
                // 添加停止动画
                stopAction = mixer.clipAction(gltf.animations[0]);
                // 添加向右转动画
                trunRightAction = mixer.clipAction(gltf.animations[3]);
                // 添加向左转动画
                trunLeftAction = mixer.clipAction(gltf.animations[2]);
                // 添加拿取动画
                takeAction = mixer.clipAction(gltf.animations[1]);

                // 为所有动画设置一次性播放并停留最后一帧
                [stopAction, trunLeftAction, trunRightAction, takeAction].forEach(action => {
                    if (action) {
                        action.clampWhenFinished = true;  // 动画结束后保持最后一帧
                        action.setLoop(THREE.LoopOnce);   // 只播放一次
                    }
                });

                // 初始化当前动作为行走动画
                currentAction = walkAction;
                walkAction.play();
                actions = [walkAction, takeAction, stopAction, trunLeftAction, trunRightAction];
                createPanel();
                if (mixer) {
                    // 监听一次性动作完成：解除冻结并淡入回“行走”，保持流程连贯
/*                    mixer.addEventListener('finished', (event) => {
                        if (waitAction && event.action === waitAction) {
                            holdMovement = false;
                            waitAction = null;
                            transitionTo(walkAction, getCrossFadeDuration());
                        }
                    });*/
                }
            });
        }

        function setWeight(action, weight) {
            if (!action) return;
            action.enabled = true;
            action.setEffectiveTimeScale(1);
            action.setEffectiveWeight(weight);
        }

        function getWeightForAction(action) {
            if (!settings) return 1;
            if (action === walkAction) return settings['walk weight'];
            if (action === takeAction) return settings['take weight'];
            if (action === trunLeftAction) return settings['turn left weight'];
            if (action === trunRightAction) return settings['turn right weight'];
            if (action === stopAction) return settings['stop weight'];
            return 1;
        }

        function transitionTo(endAction, duration = 0.5) {
            // 统一的动作切换入口：重置目标动作，设置权重，使用 crossFadeTo 做淡入淡出
            if (!endAction) return;
            if (!currentAction) {
                endAction.reset().play();
                currentAction = endAction;
                return;
            }
            if (currentAction === endAction) return;
            endAction.reset().play();
            setWeight(endAction, getWeightForAction(endAction));
            currentAction.crossFadeTo(endAction, duration, true);
            currentAction = endAction;
        }

        function createPanel() {
            const panel = new GUI({ width: 310 });
            const folder1 = panel.addFolder('Visibility');
            const folder3 = panel.addFolder('Pausing/Stepping');
            const folder4 = panel.addFolder('Crossfading');
            const folder5 = panel.addFolder('Blend Weights');
            const folder6 = panel.addFolder('General Speed');

            settings = {
                'show robot': true,
                'show map': true,
                'show axes': true,
                'show lookAt': true,
                'loop animation': false,
                'pause/continue': pauseContinue,
                'make single step': toSingleStepMode,
                'modify step size': 0.05,
                'use default duration': 0.5,
                'set custom duration': 0.5,
                'walk weight': 1.0,
                'take weight': 0.6,
                'turn left weight': 0.8,
                'turn right weight': 0.8,
                'stop weight': 0.4,
                'modify time scale': 1.0
            };

            folder1.add(settings, 'show robot').onChange(v => { if (robot) robot.visible = v; });
            folder1.add(settings, 'show map').onChange(v => { if (map) map.visible = v; });
            folder1.add(settings, 'show axes').onChange(v => { if (axesHelper) axesHelper.visible = v; });
            folder1.add(settings, 'show lookAt').onChange(v => { if (lookAtGroup) lookAtGroup.visible = v; });
            folder1.add(settings, 'loop animation');

            folder3.add(settings, 'pause/continue');
            folder3.add(settings, 'make single step');
            folder3.add(settings, 'modify step size', 0.01, 0.1, 0.001);

            folder4.add(settings, 'use default duration');
            folder4.add(settings, 'set custom duration', 0, 10, 0.01);
            folder4.add({ f: () => crossTo(walkAction) }, 'f').name('to walk');
            folder4.add({ f: () => crossTo(takeAction) }, 'f').name('to take');
            folder4.add({ f: () => crossTo(trunLeftAction) }, 'f').name('to turn left');
            folder4.add({ f: () => crossTo(trunRightAction) }, 'f').name('to turn right');
            folder4.add({ f: () => crossTo(stopAction) }, 'f').name('to stop');

            folder5.add(settings, 'walk weight', 0, 1, 0.01).listen().onChange(w => setWeight(walkAction, w));
            folder5.add(settings, 'take weight', 0, 1, 0.01).listen().onChange(w => setWeight(takeAction, w));
            folder5.add(settings, 'turn left weight', 0, 1, 0.01).listen().onChange(w => setWeight(trunLeftAction, w));
            folder5.add(settings, 'turn right weight', 0, 1, 0.01).listen().onChange(w => setWeight(trunRightAction, w));
            folder5.add(settings, 'stop weight', 0, 1, 0.01).listen().onChange(w => setWeight(stopAction, w));

            folder6.add(settings, 'modify time scale', 0, 1.5, 0.01).onChange(modifyTimeScale);

            folder1.open();
            folder3.open();
            folder4.open();
            folder5.open();
            folder6.open();
        }

        function crossTo(action) {
            const duration = settings['use default duration'] ? settings['set custom duration'] : settings['set custom duration'];
            transitionTo(action, duration);
        }

        function modifyTimeScale(speed) {
            if (mixer) mixer.timeScale = speed;
        }

        function pauseContinue() {
            if (singleStepMode) {
                singleStepMode = false;
                unPauseAllActions();
            } else {
                if (!actions.length) return;
                actions[0] && actions[0].paused ? unPauseAllActions() : pauseAllActions();
            }
        }

        function pauseAllActions() {
            actions.forEach(a => { if (a) a.paused = true; });
        }

        function unPauseAllActions() {
            actions.forEach(a => { if (a) a.paused = false; });
        }

        function toSingleStepMode() {
            unPauseAllActions();
            singleStepMode = true;
            sizeOfNextStep = settings['modify step size'];
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        const handleClick = (event) => {
            // 计算鼠标位置  此处的坑是 canvas的坐标和浏览器的坐标不一样
            const rect = renderer.domElement.getBoundingClientRect();
            const mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            // 更新射线投射
            raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
            // 获取与场景中所有物体的交点
            const intersects = raycaster.intersectObjects(modelAll, true);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                // 获取点击位置
                const intersectPoint = intersects[0].point;
                console.log('Intersection point:', intersectPoint);
            }
        };
        window.addEventListener('click', handleClick);

        function getCrossFadeDuration() {
            // 过渡时长：优先使用面板设置；没有面板时使用默认值 0.5s
            return settings && settings['use default duration'] ? settings['set custom duration'] : settings ? settings['set custom duration'] : 0.5;
        }

            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(2, 1, 1);
            return sprite;
        }
        function buildLookAtMarkers() {
            lookAtGroup.clear();
            for (let i = 0; i < positionsAnimation.length; i++) {
                const seg = positionsAnimation[i];
                if (!seg.lookAt) continue;
                const g = new THREE.SphereGeometry(0.12, 16, 16);
                const m = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const s = new THREE.Mesh(g, m);
                s.position.set(seg.lookAt.x, 0.1, seg.lookAt.z);
                const label = createTextSprite(`${seg.lookAt.x.toFixed(2)}, ${seg.lookAt.z.toFixed(2)}`);
                label.position.set(seg.lookAt.x, 0.6, seg.lookAt.z);
                lookAtGroup.add(s);
                lookAtGroup.add(label);
            }
        }

        function moveSquare(delta) {
            // 每段固定 5 秒：按 delta 推进时间；冻结期间不推进（保持原地播放一次性动作）
            const segmentTime = 5;
            if (!holdMovement) {
                t += delta;
            }

            // 当前段索引与插值
            const progress = t / segmentTime;
            const currentIndex = Math.floor(progress);
            const currentSegment = currentIndex % positionsAnimation.length;

            // 确定下一段索引：如果不循环且已是最后一段，则不再回到起点（保持在原地）
            let nextIndex = (currentSegment + 1) % positionsAnimation.length;
            if (!settings['loop animation'] && currentSegment === positionsAnimation.length - 1) {
                nextIndex = currentSegment;
            }

            const interpolation = progress - currentIndex;
            const currentPos = positionsAnimation[currentSegment].position;
            const nextPos = positionsAnimation[nextIndex].position;
            // 位置插值（x、z）
            const x = currentPos.x + (nextPos.x - currentPos.x) * interpolation;
            const z = currentPos.z + (nextPos.z - currentPos.z) * interpolation;
            robot.position.set(x, 0, z);
            // 段触发：仅在段索引变化时切换动作，避免每帧抖动
            if (prevSegmentIndex !== currentSegment) {
                prevSegmentIndex = currentSegment;
                const crossFadeDuration = getCrossFadeDuration();
                const turn = positionsAnimation[currentSegment].turn;
                if (turn === 'trunLeft') {
                    holdMovement = true;             // 冻结位移
                    waitAction = trunLeftAction;     // 等待转身完成
                    transitionTo(trunLeftAction, crossFadeDuration);
                } else if (turn === 'trunRight') {
                    holdMovement = true;
                    waitAction = trunRightAction;
                    transitionTo(trunRightAction, crossFadeDuration);
                } else if (turn === 'pause') {
                    holdMovement = true;
                    waitAction = takeAction;
                    transitionTo(takeAction, crossFadeDuration);
                } else {
                    // 普通段：恢复位移与行走
                    holdMovement = false;
                    waitAction = null;
                    transitionTo(walkAction, crossFadeDuration);
                }
            }

            const lookAtCfg = positionsAnimation[currentSegment].lookAt;
            if (lookAtCfg) {
                //robot.lookAt(lookAtCfg.x, 0, lookAtCfg.z);
            }
            // 标签与门状态更新
            if (robotLabel) {
                robotLabel.position.set(x, 4, z);
                updateLabelContent(positionsAnimation[currentSegment].showMessage);
            }
            updateDoorState(positionsAnimation[currentSegment].showMessage);
        }

        function updateDoorState(currentStatus) {
            if (!leftDoor || !rightDoor) return;
            if (currentStatus === '加工中') {
                if (!isProcessing) {
                    isProcessing = true;
                    animationDirection = 1; // 开门
                }
            } else {
                if (isProcessing) {
                    isProcessing = false;
                    animationDirection = -1; // 关门
                }
            }
        }

        function updateDoors(delta) {
            if (!leftDoor || !rightDoor || animationDirection === 0) return;
            // 门移动速度，使得在3秒内完成移动
            const doorSpeed = 1 / 3;
            // 只有当有动作指令时才更新进度
            doorAnimationProgress += delta * doorSpeed * animationDirection;
            doorAnimationProgress = Math.max(0, Math.min(1, doorAnimationProgress));
            // 更新门的位置
            leftDoor.position.z = doorInitialZ.left + doorAnimationProgress;
            rightDoor.position.z = doorInitialZ.right - doorAnimationProgress;
            // 当动画完成时重置方向
            if (doorAnimationProgress >= 1 || doorAnimationProgress <= 0) {
                animationDirection = 0; // 动画完成，停止移动
            }
        }

        // ------------------ 渲染循环 ----------------------
        let last = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            let delta = (now - last) / 1000;
            last = now;
            if (robot) {
                if (singleStepMode) {
                    delta = sizeOfNextStep;
                    sizeOfNextStep = 0;
                }
                if (mixer) mixer.update(delta);
                moveSquare(delta);
            }
            // 更新门的位置
            updateDoors(delta);
            // 更新图表纹理
            scene.traverse((child) => {
                if (child.isMesh && child.chartTexture) {
                    child.chartTexture.needsUpdate = true;
                }
            });
            renderer.render(scene, camera);
        }

        // 初始化
        init();
        animate();
    </script>

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Robot Path Demo</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111;
        }
    </style>
</head>

<body>
    <video id="videoContainer" style="display: none;" autoplay loop muted>
        <source src="/video/bi.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
    </video>
    <canvas id="container"></canvas>
    <script type="importmap">
    {
      "imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/addons/": "https://threejs.org/examples/jsm/",
        "echarts": "https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.esm.min.js"
      }
    }
    </script>

    <script type="module">
        

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { DRACOLoader } from './js/DRACOLoader.js';
        import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { setupChartTexture } from './js/chartTexture.js';
        import { buildLookAtMarkers, createTextSprite } from './js/lookAtMarkers.js';
        import { positionsAnimation } from './js/positionsAnimation.js';
        import { createPanel as createControlPanel } from './js/panel.js';

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');

        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        const raycaster = new THREE.Raycaster();
        let scene, camera, renderer, controls;
        let map, robot, mixer, walkAction, modelAll;

        let t = 0;

        // 修改全局变量初始化
        let leftDoor = null;
        let rightDoor = null;
        let doorInitialZ = {};
        let isProcessing = false;
        let doorAnimationProgress = 0;
        let animationDirection = 0; // 0表示无动作，1表示开门，-1表示关门

        let robotLabel = null;



        let stopAction = null;
        let takeAction = null;

        let trunLeftAction = null;
        let trunRightAction = null;

        let currentAction = null;
        let actions = [];
        let settings;
        let singleStepMode = false;
        let sizeOfNextStep = 0;
        let axesHelper = null;
        let lookAtGroup = null;
        // 上一次路径段索引（用于“段触发”，避免每帧重复切换动作）
        let prevSegmentIndex = -1;
        // 冻结位移（播放一次性动作期间暂停移动插值，动作完成后恢复）
        let holdMovement = false;
        // 当前等待完成的一次性动作（转身/拿取/停等）
        let waitAction = null;

        function init() {
            scene = new THREE.Scene();
            // scene.background = new THREE.Color(0x222222);
            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(20, 20, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById("container") });
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls = new OrbitControls(camera, renderer.domElement);

            axesHelper = new THREE.AxesHelper(3);
            scene.add(axesHelper);
            axesHelper.visible = false;
            lookAtGroup = new THREE.Group();
            scene.add(lookAtGroup);
            lookAtGroup.visible = false;

            const light = new THREE.DirectionalLight(0xffffff, 4.5);
            light.position.set(4, 8, 7);
            scene.add(light);

            // 添加辅助光源 - 从相反方向照射，减少背面阴影
            const backLight = new THREE.DirectionalLight(0xffffff, 1.5);
            backLight.position.set(-4, -8, -7); // 相反方向
            scene.add(backLight);

            // 添加一个环境光，为整个场景提供基础照明
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            // 设置环境贴图
            const hdrLoader = new RGBELoader();
            hdrLoader.load('https://image.365me.me/static/hdr/kloofendal_48d_partly_cloudy_puresky_1k.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background = texture;
                // scene.environment = texture;
            }, undefined, (error) => {
                console.error('HDR贴图加载失败:', error);
                scene.background = new THREE.Color(0xffffff);
                isHdrLoadedRef.current = true;
            });
            loadMap();
            loadRobot();
            robotLabel = createRobotLabel(scene);
            window.addEventListener("resize", onResize);
            buildLookAtMarkers(positionsAnimation, lookAtGroup);
        }

        

        function loadMap() {
            gltfLoader.load("./sketchMap.glb", (gltf) => {
                map = SkeletonUtils.clone(gltf.scene);
                map.scale.set(1, 1, 1);
                const modelMap = gltf.scene;
                let arrMachines = [];
                modelMap.children.forEach((child) => {
                    if (child) {
                        arrMachines.push(child);
                    }
                });
                modelAll = arrMachines;
                scene.add(map);

                // 在模型中查找门
                findDoorsInModel(map);

                // 在模型中查找屏幕
                findScreenInModel(map);
            });
        }

        function findDoorsInModel(model) {
            model.traverse((child) => {
                if (child.isMesh) {
                    if (child.name && child.name.toLowerCase().includes('左侧门')) {
                        leftDoor = child;
                        doorInitialZ.left = child.position.z;
                    }
                    if (child.name && child.name.toLowerCase().includes('右侧门')) {
                        rightDoor = child;
                        doorInitialZ.right = child.position.z;
                    }
                }
            });
        }

        function findScreenInModel(model) {
            model.traverse((child) => {
                if (child.isMesh && child.name && child.name.includes('屏幕')) {
                    setupChartTexture(child);
                }
            });
        }

        // 载入机器人
        function loadRobot() {
            gltfLoader.load("./animation3.glb", (gltf) => {
                robot = SkeletonUtils.clone(gltf.scene);
                robot.scale.set(2, 2, 2);
                scene.add(robot);

                mixer = new THREE.AnimationMixer(robot);
                walkAction = mixer.clipAction(gltf.animations[4]); // walk 动画
                // 添加停止动画
                stopAction = mixer.clipAction(gltf.animations[0]);
                // 添加向右转动画
                trunRightAction = mixer.clipAction(gltf.animations[3]);
                // 添加向左转动画
                trunLeftAction = mixer.clipAction(gltf.animations[2]);
                // 添加拿取动画
                takeAction = mixer.clipAction(gltf.animations[1]);

                // 为所有动画设置一次性播放并停留最后一帧
                [stopAction, trunLeftAction, trunRightAction, takeAction].forEach(action => {
                    if (action) {
                        action.clampWhenFinished = true;  // 动画结束后保持最后一帧
                        action.setLoop(THREE.LoopOnce);   // 只播放一次
                    }
                });

                // 初始化当前动作为行走动画
                currentAction = walkAction;
                walkAction.play();
                actions = [walkAction, takeAction, stopAction, trunLeftAction, trunRightAction];
                settings = createControlPanel({
                    GUI,
                    robot,
                    map,
                    axesHelper,
                    lookAtGroup,
                    actions,
                    pauseContinue,
                    toSingleStepMode,
                    modifyTimeScale,
                    crossTo,
                    setWeight,
                    walkAction,
                    takeAction,
                    trunLeftAction,
                    trunRightAction,
                    stopAction
                });
                if (mixer) {
                    // 监听一次性动作完成：解除冻结并淡入回“行走”，保持流程连贯
/*                    mixer.addEventListener('finished', (event) => {
                        if (waitAction && event.action === waitAction) {
                            holdMovement = false;
                            waitAction = null;
                            transitionTo(walkAction, getCrossFadeDuration());
                        }
                    });*/
                }
            });
        }

        function setWeight(action, weight) {
            if (!action) return;
            action.enabled = true;
            action.setEffectiveTimeScale(1);
            action.setEffectiveWeight(weight);
        }

        function getWeightForAction(action) {
            if (!settings) return 1;
            if (action === walkAction) return settings['walk weight'];
            if (action === takeAction) return settings['take weight'];
            if (action === trunLeftAction) return settings['turn left weight'];
            if (action === trunRightAction) return settings['turn right weight'];
            if (action === stopAction) return settings['stop weight'];
            return 1;
        }

        function transitionTo(endAction, duration = 0.5) {
            // 统一的动作切换入口：重置目标动作，设置权重，使用 crossFadeTo 做淡入淡出
            if (!endAction) return;
            if (!currentAction) {
                endAction.reset().play();
                currentAction = endAction;
                return;
            }
            if (currentAction === endAction) return;
            endAction.reset().play();
            setWeight(endAction, getWeightForAction(endAction));
            currentAction.crossFadeTo(endAction, duration, true);
            currentAction = endAction;
        }

        

        function crossTo(action) {
            const duration = settings['use default duration'] ? settings['set custom duration'] : settings['set custom duration'];
            transitionTo(action, duration);
        }

        function modifyTimeScale(speed) {
            if (mixer) mixer.timeScale = speed;
        }

        function pauseContinue() {
            if (singleStepMode) {
                singleStepMode = false;
                unPauseAllActions();
            } else {
                if (!actions.length) return;
                actions[0] && actions[0].paused ? unPauseAllActions() : pauseAllActions();
            }
        }

        function pauseAllActions() {
            actions.forEach(a => { if (a) a.paused = true; });
        }

        function unPauseAllActions() {
            actions.forEach(a => { if (a) a.paused = false; });
        }

        function toSingleStepMode() {
            unPauseAllActions();
            singleStepMode = true;
            sizeOfNextStep = settings['modify step size'];
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const handleClick = (event) => {
            // 计算鼠标位置  此处的坑是 canvas的坐标和浏览器的坐标不一样
            const rect = renderer.domElement.getBoundingClientRect();
            const mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            // 更新射线投射
            raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
            // 获取与场景中所有物体的交点
            const intersects = raycaster.intersectObjects(modelAll, true);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                // 获取点击位置
                const intersectPoint = intersects[0].point;
                console.log('Intersection point:', intersectPoint);
            }
        };
        window.addEventListener('click', handleClick);

        function getCrossFadeDuration() {
            // 过渡时长：优先使用面板设置；没有面板时使用默认值 0.5s
            return settings && settings['use default duration'] ? settings['set custom duration'] : settings ? settings['set custom duration'] : 0.5;
        }


        function moveSquare(delta) {
            // 每段固定 5 秒：按 delta 推进时间；冻结期间不推进（保持原地播放一次性动作）
            const segmentTime = 5;
            if (!holdMovement) {
                t += delta;
            }

            // 当前段索引与插值
            const progress = t / segmentTime;
            const currentIndex = Math.floor(progress);
            const currentSegment = currentIndex % positionsAnimation.length;

            // 确定下一段索引：如果不循环且已是最后一段，则不再回到起点（保持在原地）
            let nextIndex = (currentSegment + 1) % positionsAnimation.length;
            if (!settings['loop animation'] && currentSegment === positionsAnimation.length - 1) {
                nextIndex = currentSegment;
            }

            const interpolation = progress - currentIndex;
            const currentPos = positionsAnimation[currentSegment].position;
            const nextPos = positionsAnimation[nextIndex].position;
            // 位置插值（x、z）
            const x = currentPos.x + (nextPos.x - currentPos.x) * interpolation;
            const z = currentPos.z + (nextPos.z - currentPos.z) * interpolation;
            robot.position.set(x, 0, z);
            // 段触发：仅在段索引变化时切换动作，避免每帧抖动
            if (prevSegmentIndex !== currentSegment) {
                console.log(currentSegment)
                prevSegmentIndex = currentSegment;
                const crossFadeDuration = getCrossFadeDuration();
                const turn = positionsAnimation[currentSegment].turn;
                if (turn === 'trunLeft') {
                    holdMovement = true;             // 冻结位移
                    waitAction = trunLeftAction;     // 等待转身完成
                    transitionTo(trunLeftAction, crossFadeDuration);
                } else if (turn === 'trunRight') {
                    holdMovement = true;
                    waitAction = trunRightAction;
                    transitionTo(trunRightAction, crossFadeDuration);
                } else if (turn === 'pause') {
                    holdMovement = true;
                    waitAction = takeAction;
                    transitionTo(takeAction, crossFadeDuration);
                } else {
                    // 普通段：恢复位移与行走
                    holdMovement = false;
                    waitAction = null;
                    transitionTo(walkAction, crossFadeDuration);
                }
            }

            const lookAtCfg = positionsAnimation[currentSegment].lookAt;
            if (lookAtCfg) {
                //robot.lookAt(lookAtCfg.x, 0, lookAtCfg.z);
            }
            // 标签与门状态更新
            if (robotLabel) {
                robotLabel.position.set(x, 4, z);
                updateRobotLabel(robotLabel, positionsAnimation[currentSegment].showMessage, scene);
            }
            updateDoorState(positionsAnimation[currentSegment].showMessage);
        }

        function updateDoorState(currentStatus) {
            if (!leftDoor || !rightDoor) return;
            if (currentStatus === '加工中') {
                if (!isProcessing) {
                    isProcessing = true;
                    animationDirection = 1; // 开门
                }
            } else {
                if (isProcessing) {
                    isProcessing = false;
                    animationDirection = -1; // 关门
                }
            }
        }

        function updateDoors(delta) {
            if (!leftDoor || !rightDoor || animationDirection === 0) return;
            // 门移动速度，使得在3秒内完成移动
            const doorSpeed = 1 / 3;
            // 只有当有动作指令时才更新进度
            doorAnimationProgress += delta * doorSpeed * animationDirection;
            doorAnimationProgress = Math.max(0, Math.min(1, doorAnimationProgress));
            // 更新门的位置
            leftDoor.position.z = doorInitialZ.left + doorAnimationProgress;
            rightDoor.position.z = doorInitialZ.right - doorAnimationProgress;
            // 当动画完成时重置方向
            if (doorAnimationProgress >= 1 || doorAnimationProgress <= 0) {
                animationDirection = 0; // 动画完成，停止移动
            }
        }

        // ------------------ 渲染循环 ----------------------
        let last = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            let delta = (now - last) / 1000;
            last = now;
            if (robot) {
                if (singleStepMode) {
                    delta = sizeOfNextStep;
                    sizeOfNextStep = 0;
                }
                if (mixer) mixer.update(delta);
                moveSquare(delta);
            }
            // 更新门的位置
            updateDoors(delta);
            // 更新图表纹理
            scene.traverse((child) => {
                if (child.isMesh && child.chartTexture) {
                    child.chartTexture.needsUpdate = true;
                }
            });
            renderer.render(scene, camera);
        }

        // 初始化
        init();
        animate();
    </script>

</body>

</html>

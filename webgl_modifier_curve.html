<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js webgl - curve modifier</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
	<link type="text/css" rel="stylesheet" href="main.css" />
</head>

<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - curve modifier
	</div>

	<script type="importmap">
			{
				"imports": {
					"three": "https://threejs.org/build/three.module.js",
					"three/addons/": "https://threejs.org/examples/jsm/"
				}
			}
		</script>

	<script type="module">
		import * as THREE from 'three';
		import { TransformControls } from 'three/addons/controls/TransformControls.js';
		import Stats from 'three/addons/libs/stats.module.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { DRACOLoader } from './js/DRACOLoader.js';
		import { Flow } from 'three/addons/modifiers/CurveModifier.js';
		import { FontLoader } from 'three/addons/loaders/FontLoader.js';
		import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
		import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

		const ACTION_SELECT = 1, ACTION_NONE = 0;
		const curveHandles = [];
		const mouse = new THREE.Vector2();

		const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');

        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

		let stats;
		let scene,
			camera,
			renderer,
			rayCaster,
			control,
			textFlow,
			robotFlow, // 机器人Flow对象
			robot,
			mixer,
			walkAction,
			currentAction,
			action = ACTION_NONE;

		init();

		function init() {

			scene = new THREE.Scene();

			camera = new THREE.PerspectiveCamera(
				40,
				window.innerWidth / window.innerHeight,
				1,
				1000
			);
			camera.position.set(2, 2, 4);
			camera.lookAt(scene.position);

			const initialPoints = [
				{ x: 2, y: 0, z: - 2 },
				{ x: 1, y: 0, z: 1 },
				{ x: - 1, y: 0, z: 1 },
				{ x: - 1, y: 0, z: - 1 },
			];

			const boxGeometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
			const boxMaterial = new THREE.MeshBasicMaterial();

			for (const handlePos of initialPoints) {

				const handle = new THREE.Mesh(boxGeometry, boxMaterial);
				handle.position.copy(handlePos);
				curveHandles.push(handle);
				scene.add(handle);

			}

			const curve = new THREE.CatmullRomCurve3(
				curveHandles.map((handle) => handle.position)
			);
			curve.curveType = 'centripetal';
			curve.closed = true;

			const points = curve.getPoints(50);
			const line = new THREE.LineLoop(
				new THREE.BufferGeometry().setFromPoints(points),
				new THREE.LineBasicMaterial({ color: 0x00ff00 })
			);

			scene.add(line);

			//

			const light = new THREE.DirectionalLight(0xffaa33, 3);
			light.position.set(- 10, 10, 10);
			scene.add(light);

			const light2 = new THREE.AmbientLight(0x003973, 3);
			scene.add(light2);

			// 加载机器人模型并添加到曲线
			function loadRobot() {
				gltfLoader.load("./animation3.glb", (gltf) => {
					robot = SkeletonUtils.clone(gltf.scene);
					robot.scale.set(0.5, 0.5, 0.5);
					
					// 创建机器人Flow对象
					robotFlow = new Flow(robot);
					robotFlow.updateCurve(0, curve);
					scene.add(robotFlow.object3D);

					console.log(robot);
					mixer = new THREE.AnimationMixer(robot);
					walkAction = mixer.clipAction(gltf.animations[4]); // walk 动画

					if (walkAction) {
						walkAction.setDuration(5);  // 5秒内完成
					}

					// 初始化当前动作为行走动画
					currentAction = walkAction;
					walkAction.play();
				});
			}

			loadRobot()

			const loader = new FontLoader();
			loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (font) {

				const geometry = new TextGeometry('Hello three.js!', {
					font: font,
					size: 0.2,
					depth: 0.05,
					curveSegments: 12,
					bevelEnabled: true,
					bevelThickness: 0.02,
					bevelSize: 0.01,
					bevelOffset: 0,
					bevelSegments: 5,
				});

				geometry.rotateX(Math.PI);

				const material = new THREE.MeshStandardMaterial({
					color: 0x99ffff
				});

				const textObject = new THREE.Mesh(geometry, material);

				// 创建文字Flow对象
				textFlow = new Flow(textObject);
				textFlow.updateCurve(0, curve);
				scene.add(textFlow.object3D);

			});

			//

			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			document.body.appendChild(renderer.domElement);

			renderer.domElement.addEventListener('pointerdown', onPointerDown);

			rayCaster = new THREE.Raycaster();
			control = new TransformControls(camera, renderer.domElement);
			control.addEventListener('dragging-changed', function (event) {

				if (!event.value) {

					const points = curve.getPoints(50);
					line.geometry.setFromPoints(points);
					// 更新两个Flow对象的曲线
					if (textFlow) textFlow.updateCurve(0, curve);
					if (robotFlow) robotFlow.updateCurve(0, curve);

				}

			});

			stats = new Stats();
			document.body.appendChild(stats.dom);

			window.addEventListener('resize', onWindowResize);

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

		}

		function onPointerDown(event) {

			action = ACTION_SELECT;
			mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
			mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

		}

		function animate() {

			if (action === ACTION_SELECT) {

				rayCaster.setFromCamera(mouse, camera);
				action = ACTION_NONE;
				const intersects = rayCaster.intersectObjects(curveHandles, false);
				if (intersects.length) {

					const target = intersects[0].object;
					control.attach(target);
					scene.add(control.getHelper());

				}

			}

			// 更新两个对象的动画
			if (textFlow) {
				textFlow.moveAlongCurve(0.001);
			}
			
			if (robotFlow) {
				robotFlow.moveAlongCurve(0.001);
			}
			
			// 更新机器人动画混合器
			if (mixer) {
				mixer.update(0.016); // 使用固定时间步长，约60fps
			}

			render();

		}

		function render() {

			renderer.render(scene, camera);

			stats.update();

		}
	</script>
</body>

</html>

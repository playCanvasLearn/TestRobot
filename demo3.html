<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Robot Path Demo</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111;
        }
    </style>
</head>

<body>
    <video id="videoContainer" style="display: none;" autoplay loop muted>
        <source src="/video/bi.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
    </video>
    <canvas id="container"></canvas>
    <script type="importmap">
    {
      "imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/addons/": "https://threejs.org/examples/jsm/"
      }
    }
</script>

    <script type="module">
        const positionsAnimation = [
            // { showMessage: '', turn: 'walking_West', position: { x: 1.3, y: 0, z: 3.3 } }, //初始位置
            { showMessage: '去拿料', turn: '', position: { x: 1.8, y: 0, z: 2.5 } },
            { showMessage: '拿料中', turn: 'pause', position: { x: 1.8, y: 0, z: 4.5 } },
            { showMessage: '去加工', turn: '', position: { x: 1.7, y: 0, z: 4.5 } },
            { showMessage: '去加工', turn: '', position: { x: 1.7, y: 0, z: -1 } },
            { showMessage: '加工中', turn: 'pause', position: { x: 0.3, y: 0, z: -0.9 } },
            // { showMessage: '加工中', turn: 'pause', position: { x: 0.29, y: 0, z: -0.9 } },
            { showMessage: '去检测', turn: '', position: { x: 0.3, y: 0, z: -0.9 } },
            { showMessage: '去检测', turn: 'pause', position: { x: 0.3, y: 0, z: -6.5 } },
            { showMessage: '检测中', turn: '', position: { x: 0.2, y: 0, z: -6.5 } },
            { showMessage: '去加工', turn: '', position: { x: 0.2, y: 0, z: -3.5 } },
            { showMessage: '加工中', turn: 'pause', position: { x: 0.4, y: 0, z: -0.9 } },
            { showMessage: '去检测', turn: '', position: { x: 0.3, y: 0, z: -0.9 } },
            { showMessage: '检测中', turn: 'pause', position: { x: 0.3, y: 0, z: -6.5 } },
            { showMessage: '合格', turn: '', position: { x: 0.2, y: 0, z: -6.5 } },
            { showMessage: '合格', turn: '', position: { x: 0.2, y: 0, z: -3.7 } },
            { showMessage: '去放料', turn: '', position: { x: 0.3, y: 0, z: 0 } },
            { showMessage: '去放料', turn: '', position: { x: 0.3, y: 0, z: 2.7 } },
            { showMessage: '去放料', turn: '', position: { x: -1.1, y: 0, z: 2.7 } },
            { showMessage: '放料中', turn: 'pause', position: { x: -1.2, y: 0, z: 4.5 } },
            { showMessage: '去拿料', turn: '', position: { x: -1.3, y: 0, z: 4.5 } },
            { showMessage: '去拿料', turn: '', position: { x: -1.3, y: 0, z: 2.7 } },
            { showMessage: '去拿料', turn: '', position: { x: 1.8, y: 0, z: 2.5 } }, //初始位置
        ];

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from './js/DRACOLoader.js';
        import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

        const raycaster = new THREE.Raycaster();
        let scene, camera, renderer, controls;
        let map, robot, mixer, walkAction, modelAll;

        let t = 0;

        const speed = 0.1;

        // 修改全局变量初始化
        let leftDoor = null;
        let rightDoor = null;
        let doorInitialZ = {};
        let isProcessing = false;
        let doorAnimationProgress = 0;
        let animationDirection = 0; // 0表示无动作，1表示开门，-1表示关门

        let isPaused = false;
        let pauseStartTime = null;

        let robotLabel = null;
        let currentLabelContent = '';

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(10, 8, 12);
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById("container") });
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls = new OrbitControls(camera, renderer.domElement);
            // 灯光
            const light = new THREE.DirectionalLight(0xffffff, 5);
            light.position.set(5, 10, 7);
            scene.add(light);
            loadMap();
            loadRobot();
            createRobotLabel(); // 创建机器人标签
            window.addEventListener("resize", onResize);
        }

        // 创建机器人头顶标签的函数
        function createRobotLabel() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 50;
            canvas.height = 20;

            // 创建canvas纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            // 创建材质
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false // 确保标签始终可见
            });

            // 创建精灵对象
            robotLabel = new THREE.Sprite(material);
            robotLabel.scale.set(1, 0.5, 0.5); // 调整标签大小
            robotLabel.visible = false; // 初始隐藏
            scene.add(robotLabel);
        }

        // 更新标签内容的函数
        function updateLabelContent(text) {
            if (!robotLabel || currentLabelContent === text) return;

            currentLabelContent = text;

            if (text === '') {
                robotLabel.visible = false;
                return;
            }

            robotLabel.visible = true;

            // 更新canvas内容
            const canvas = robotLabel.material.map.image;
            const context = canvas.getContext('2d');

            // 清空画布
            context.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            context.fillStyle = 'rgba(0, 0, 0, 0.5)';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制文字
            context.font = '12px Arial';
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            // 文字换行处理
            const words = text.split('');
            let line = '';
            const lines = [];
            const maxWidth = canvas.width;

            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i];
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(line);
                    line = words[i];
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            // 绘制多行文字
            const lineHeight = 30;
            const startY = (canvas.height - (lines.length - 1) * lineHeight) / 2;

            for (let i = 0; i < lines.length; i++) {
                context.fillText(lines[i], canvas.width / 2, startY + i * lineHeight);
            }

            // 更新纹理
            robotLabel.material.map.needsUpdate = true;
        }

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');

        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        function loadMap() {
            gltfLoader.load("./sketchMap.glb", (gltf) => {
                map = SkeletonUtils.clone(gltf.scene);
                map.scale.set(1, 1, 1);
                const modelMap = gltf.scene;
                let arrMachines = [];
                modelMap.children.forEach((child) => {
                    if (child) {
                        arrMachines.push(child);
                    }
                });
                modelAll = arrMachines;
                scene.add(map);

                // 在模型中查找门
                findDoorsInModel(map);

                // 在模型中查找屏幕
                findScreenInModel(map);
            });
        }

        function findDoorsInModel(model) {
            model.traverse((child) => {
                if (child.isMesh) {
                    if (child.name && child.name.toLowerCase().includes('左侧门')) {
                        leftDoor = child;
                        doorInitialZ.left = child.position.z;
                    }
                    if (child.name && child.name.toLowerCase().includes('右侧门')) {
                        rightDoor = child;
                        doorInitialZ.right = child.position.z;
                    }
                }
            });
        }

        function findScreenInModel(model) {
            model.traverse((child) => {
                if (child.isMesh && child.name && child.name.includes('屏幕')) {
                    setupVideoTexture(child);
                }
            });
        }

        // 创建视频纹理函数
        function setupVideoTexture(screenMesh) {
            // 获取视频元素
            const video = document.getElementById("videoContainer");

            if (!video) {
                console.warn("无法找到视频容器");
                return;
            }

            // 创建视频纹理
            const videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBAFormat;
            videoTexture.generateMipmaps = false;
            videoTexture.wrapS = THREE.ClampToEdgeWrapping;
            videoTexture.wrapT = THREE.ClampToEdgeWrapping;

            // 检查并添加UV坐标（如果没有的话）
            if (!screenMesh.geometry.attributes.uv) {
                generateUVCoordinates(screenMesh.geometry);
            }

            // 为屏幕创建专用材质，避免影响其他模型
            if (screenMesh.material) {
                // 创建新的材质而不是修改现有材质
                const videoMaterial = new THREE.MeshBasicMaterial({
                    map: videoTexture,
                    transparent: false
                });

                // 将新材质应用到屏幕网格
                screenMesh.material = videoMaterial;
                screenMesh.material.needsUpdate = true;
            }

            // 确保视频属性设置正确
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;

            // 添加事件监听器确保视频播放
            video.addEventListener('canplay', () => {
                if (video.paused) {
                    video.play().catch(error => {
                        console.warn("视频播放失败:", error);
                    });
                }
            });

            // 如果视频已经可以播放，则直接播放
            if (video.readyState >= 2) {
                video.play().catch(error => {
                    console.warn("视频播放失败:", error);
                });
            }

            // 监听视频播放状态
            video.addEventListener('playing', () => {
                console.log("视频正在播放");
            });
        }

        // 生成默认UV坐标的函数
        function generateUVCoordinates(geometry) {
            const positionAttribute = geometry.attributes.position;
            const vertexCount = positionAttribute.count;

            // 创建UV坐标数组
            const uvArray = new Float32Array(vertexCount * 2);

            // 为每个顶点生成简单的UV坐标（这里假设是矩形屏幕）
            for (let i = 0; i < vertexCount; i++) {
                // 简单的UV映射，可以根据实际模型调整
                uvArray[i * 2] = (positionAttribute.getX(i) + 1) / 2;     // U坐标
                uvArray[i * 2 + 1] = (positionAttribute.getY(i) + 1) / 2; // V坐标
            }

            // 添加UV属性到几何体
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvArray, 2));
            geometry.attributes.uv.needsUpdate = true;

        }

        // 载入机器人
        function loadRobot() {
            gltfLoader.load("./walking.glb", (gltf) => {
                robot = SkeletonUtils.clone(gltf.scene);
                robot.scale.set(2, 2, 2);
                scene.add(robot);

                mixer = new THREE.AnimationMixer(robot);
                walkAction = mixer.clipAction(gltf.animations[0]); // walk 动画
                walkAction.play();
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const handleClick = (event) => {
            // 计算鼠标位置  此处的坑是 canvas的坐标和浏览器的坐标不一样
            const rect = renderer.domElement.getBoundingClientRect();
            const mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            const mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            // 更新射线投射
            raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
            // 获取与场景中所有物体的交点
            const intersects = raycaster.intersectObjects(modelAll, true);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                // 获取点击位置
                const intersectPoint = intersects[0].point;
                // console.log('Intersection point:', intersectPoint);
            }
        };
        window.addEventListener('click', handleClick);

        function moveSquare(delta) {
            if (isPaused) return; // 如果正在暂停则不执行移动逻辑

            const segmentTime = 5;
            t += delta;

            const progress = t / segmentTime;
            const currentIndex = Math.floor(progress);
            const currentSegment = currentIndex % positionsAnimation.length;
            const nextIndex = (currentSegment + 1) % positionsAnimation.length;
            const interpolation = progress - currentIndex;
            const currentPos = positionsAnimation[currentSegment].position;
            const nextPos = positionsAnimation[nextIndex].position;
            const x = currentPos.x + (nextPos.x - currentPos.x) * interpolation;
            const z = currentPos.z + (nextPos.z - currentPos.z) * interpolation;
            robot.position.set(x, 0, z);
            if (Math.abs(nextPos.x - currentPos.x) > 0.01 || Math.abs(nextPos.z - currentPos.z) > 0.01) {
                robot.lookAt(nextPos.x, 0, nextPos.z);
            }
            // 更新机器人标签位置和内容
            if (robotLabel) {
                // 设置标签位置在机器人头顶
                robotLabel.position.set(x, 4, z); // Y轴稍微高于机器人
                // 更新标签内容
                updateLabelContent(positionsAnimation[currentSegment].showMessage);
            }

            // 判断当前状态并控制门的开合
            updateDoorState(positionsAnimation[currentSegment].showMessage);
            // 判断是否进入暂停状态
            if (positionsAnimation[currentSegment].turn === 'pause') {
                isPaused = true;
                pauseStartTime = performance.now();
                // 暂停动画而不是停止
                if (walkAction) walkAction.paused = true;
                setTimeout(() => {
                    isPaused = false;
                    t += segmentTime; // 手动跳过这段暂停的时间
                    if (walkAction) walkAction.paused = false; // 恢复动画
                }, 5000); // 暂停5秒
            }
        }
        function updateDoorState(currentStatus) {
            if (!leftDoor || !rightDoor) return;
            if (currentStatus === '加工中') {
                if (!isProcessing) {
                    isProcessing = true;
                    animationDirection = 1; // 开门
                }
            } else {
                if (isProcessing) {
                    isProcessing = false;
                    animationDirection = -1; // 关门
                }
            }
        }

        function updateDoors(delta) {
            if (!leftDoor || !rightDoor || animationDirection === 0) return;
            // 门移动速度，使得在3秒内完成移动
            const doorSpeed = 1 / 3;
            // 只有当有动作指令时才更新进度
            doorAnimationProgress += delta * doorSpeed * animationDirection;
            doorAnimationProgress = Math.max(0, Math.min(1, doorAnimationProgress));
            // 更新门的位置
            leftDoor.position.z = doorInitialZ.left + doorAnimationProgress;
            rightDoor.position.z = doorInitialZ.right - doorAnimationProgress;
            // 当动画完成时重置方向
            if (doorAnimationProgress >= 1 || doorAnimationProgress <= 0) {
                animationDirection = 0; // 动画完成，停止移动
            }
        }

        // ------------------ 渲染循环 ----------------------
        let last = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = (now - last) / 1000;
            last = now;
            if (robot) {
                if (mixer) mixer.update(delta);
                moveSquare(delta);
            }
            // 更新门的位置
            updateDoors(delta);
            renderer.render(scene, camera);
        }

        // 初始化
        init();
        animate();
    </script>

</body>

</html>
